[project]
name = "cititrends-voice-process"
version = "0.1.0"
description = "Voice-first warehouse receiving inspection (LangGraph scaffold)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "deepgram-sdk>=3.0.0",
  "edge-tts>=7.0.0",
  "sounddevice>=0.4.6",
  "numpy",
  "soundfile>=0.12.0",
  "python-dotenv>=1.0.0",
]

dev = ["pytest>=7.0.0"]
app = ["streamlit>=1.32.0"]
api = ["fastapi", "uvicorn[standard]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/cititrends_voice_process"]
